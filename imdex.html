<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/style.css" rel="stylesheet" type="text/css" media="all">
  <title>魔法少女診断</title>
</head>
<body>
  <div class="container">
    <h1>✨ 魔法少女診断 ✨</h1>
    
    <div class="progress" id="progress"></div>
    
    <div class="question-area" id="questionArea">
      <div class="question" id="question"></div>
      <div class="choices" id="choices"></div>
    </div>
    
    <div class="result-area" id="resultArea">
      <div class="result-code" id="resultCode"></div>
      <div class="result-type" id="resultType"></div>
      <div class="result-subtitle" id="resultSubtitle"></div>
      
      <div class="result-roles">
        <div class="role-title">戦闘ロール（両方の特性を持つ）</div>
        <div class="role-items" id="roleItems"></div>
      </div>
      
      <img class="result-image" id="resultImage" alt="診断結果">
      <div class="result-desc" id="resultDesc"></div>
      <div class="result-params" id="resultParams"></div>
      <button class="retry-btn" onclick="restart()">もう一度診断する</button>
    </div>
  </div>

<script async="" src="./js/diagnosis.js"></script></body>
</html>
